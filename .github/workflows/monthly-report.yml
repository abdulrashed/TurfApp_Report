name: Monthly Report

on:
  schedule:
    # Runs at 00:00 UTC on the 2nd day of every month
    - cron: '0 0 2 * *'
  workflow_dispatch: # allows manual triggering for testing

permissions:
  # Scheduled workflows in inactive public repositories are automatically
  # disabled. The final scheduled-only step records a successful run so this
  # monthly workflow remains active and leaves a delivery audit trail.
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test report calculations
        run: npm test

      - name: Setup .env
        run: |
          echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" >> .env
          echo "EMAIL_PASS=${{ secrets.EMAIL_PASS }}" >> .env
          echo "FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" >> .env

      - name: Run report
        run: node monthly_report.js

      - name: Record successful scheduled delivery
        if: github.event_name == 'schedule'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/monthly-report-last-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/monthly-report-last-success.txt
          git commit -m "chore: record monthly report delivery [skip ci]"
          git push origin HEAD:main
